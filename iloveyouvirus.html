<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Arial',sans-serif;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    width:90%;
    max-width:700px;
    color:white;
    z-index:10;
}

h1{
    margin-bottom:20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#message{
    margin-top:25px;
    display:none;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:25px;
    border-radius:20px;
    line-height:1.8;
    font-size:18px;
}

.heart{
    position:absolute;
    color:white;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

#loveText{
    font-size:40px;
    font-weight:bold;
    color:#fff;
    margin-bottom:20px;
}
</style>
</head>
<body>

<div class="container">

    <h1>🌙 A Small Message For You 🌙</h1>

    <button onclick="startSurprise()">
        Click Me ❤️
    </button>

    <div id="message">
        <div id="loveText"></div>

        <div id="typing"></div>
    </div>

</div>

<!-- Optional Music -->
<audio id="music" loop>
<source src="your-song.mp3" type="audio/mpeg">
</audio>

<script>

function startSurprise(){

    document.getElementById("message").style.display="block";


    // I Love You Animation
    let text = "❤️ I LOVE YOU ❤️";
    let i = 0;

    let loveInterval = setInterval(()=>{
        document.getElementById("loveText").innerHTML += text.charAt(i);
        i++;

        if(i >= text.length){
            clearInterval(loveInterval);
        }
    },100);

    // Long Message
    const msg = `
Good night, Sophia ❤️

Before you sleep, I just wanted to remind you how much you mean to me.

No matter how stressful or tiring my day gets, somehow thinking about you always makes things better. Your smile, your kindness, and even the little things you do stay in my mind longer than you probably realize.

I hope tonight brings you peaceful rest, beautiful dreams, and a heart free from worries.

Remember that you are appreciated, valued, and loved more than words can fully express.

So close your eyes, cuddle your pillow, and let yourself rest.

Tomorrow is another day, and I hope it brings you happiness, laughter, and reasons to smile.

Sweet dreams, my favorite person. ❤️

I love you so much.

Good night, Mi Amor. 🌙✨
`;

    let index = 0;

    function typeWriter(){
        if(index < msg.length){
            document.getElementById("typing").innerHTML += msg.charAt(index);
            index++;
            setTimeout(typeWriter,35);
        }
    }

    typeWriter();
}

// Floating Hearts
setInterval(()=>{
    let heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);

},300);

</script>

</body>
</html>
